<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Mods</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:radial-gradient(circle at top,#0a0a0a,#000);
color:white;
}

header{
text-align:center;
padding:60px 20px;
}

.logo{
font-size:3.5rem;
color:#00ff88;
text-shadow:0 0 25px #00ff88;
}

.sub{color:#aaa;margin-top:10px;}

.search{
max-width:600px;
margin:20px auto;
padding:0 20px;
}

.search input{
width:100%;
padding:14px;
border-radius:30px;
border:none;
outline:none;
background:#111;
color:white;
border:1px solid #222;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
padding:20px;
max-width:1200px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.05);
border-radius:15px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.1);
transition:0.3s;
}

.card:hover{transform:translateY(-5px);}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.content{padding:15px;}

.content h3{color:#00ff88;margin:0;}

.content p{color:#aaa;font-size:0.9rem;}

.btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(90deg,#00ff88,#00aaff);
}

.progress{
height:6px;
background:#222;
border-radius:10px;
margin-top:10px;
overflow:hidden;
display:none;
}

.bar{
height:100%;
width:0%;
background:#00ff88;
transition:0.2s;
}

.toast{
position:fixed;
bottom:20px;
right:20px;
background:#111;
padding:12px 16px;
border-left:4px solid #00ff88;
display:none;
}

section{
text-align:center;
padding:40px 20px;
color:#aaa;
}

h2{color:#00ff88;}

/* MOD SECRETO */
#secretMod{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:20px;
border:1px solid #00ff88;
border-radius:15px;
width:300px;
text-align:center;
}
</style>
</head>

<body>

<header>
<div class="logo">PLAY MODS</div>
<div class="sub">Mods seguros • Actualización semanal</div>
</header>

<div class="search">
<input id="search" placeholder="Buscar mods...">
</div>

<div class="grid">

<div class="card">
<img src="rblx.png">

<div class="content">
<h3>Roblox Mod</h3>
<p>Mejoras visuales y funciones extra.</p>

<button class="btn" onclick="downloadMod(this)">
Ver anuncio y descargar
</button>

<div class="progress">
<div class="bar"></div>
</div>

</div>
</div>

</div>

<section>
<h2>❓ FAQ</h2>
<p>
✔ Gratis<br>
✔ Actualización semanal<br>
✔ Descargas externas
</p>
</section>

<div class="toast" id="toast"></div>

<!-- MOD SECRETO JENNY -->
<div id="secretMod">
<h3>🟣 Jenny Mod</h3>
<p>Mod secreto desbloqueado</p>
<button class="btn" onclick="window.open('https://www.mediafire.com/file/od6nt3rf9tpzyyv/Delta-updated.apk/file','_blank')">
Descargar Jenny Mod
</button>
</div>

<script>

let locked = false;
let tabActive = true;
let startTime = 0;

function toast(msg){
let t=document.getElementById("toast");
t.innerText=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",2500);
}

document.addEventListener("visibilitychange",()=>{
tabActive = !document.hidden;
});

/* ===== EASTER EGG JENNY ===== */
let buffer = "";

document.addEventListener("keydown",(e)=>{
buffer += e.key.toLowerCase();
if(buffer.includes("jenny")){
document.getElementById("secretMod").style.display="block";
toast("🟣 Jenny Mod desbloqueado");
buffer="";
}
if(buffer.length > 20) buffer="";
});

/* ===== DESCARGA SEGURA ===== */
function downloadMod(btn){

if(locked) return;
locked = true;

startTime = Date.now();

window.open("https://omg10.com/4/11120812","_blank");

btn.disabled = true;

let time = 6;
let progress = 0;

let bar = btn.parentElement.querySelector(".bar");
bar.parentElement.style.display = "block";

let interval = setInterval(()=>{

if(!tabActive){
clearInterval(interval);
locked = false;
btn.disabled = false;
btn.innerText = "Ver anuncio y descargar";
toast("❌ Descarga inválida");
return;
}

time--;
progress += 16.6;

btn.innerText = "Espera " + time + "s";
bar.style.width = progress + "%";

if(time <= 0){

clearInterval(interval);

let real = (Date.now() - startTime)/1000;

if(real < 6 || !tabActive){
locked = false;
btn.disabled = false;
btn.innerText = "Ver anuncio y descargar";
toast("❌ Descarga inválida");
return;
}

btn.innerText = "Descargar APK";
btn.disabled = false;

btn.onclick = () => {
window.open("https://www.mediafire.com/file/od6nt3rf9tpzyyv/Delta-updated.apk/file","_blank");
};

toast("✔ Desbloqueado");
locked = false;
}

},1000);

}

</script>

</body>
</html>
