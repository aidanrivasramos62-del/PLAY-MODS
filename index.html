<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Mods</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:radial-gradient(circle at top,#0a0a0a,#000);
color:white;
}

header{
text-align:center;
padding:60px 20px;
}

.logo{
font-size:3.5rem;
color:#00ff88;
text-shadow:0 0 25px #00ff88;
}

.sub{color:#aaa;margin-top:10px;}

section{
max-width:1100px;
margin:auto;
padding:20px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
border-radius:15px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.content{padding:15px;}

h2{
color:#00ff88;
text-align:center;
margin-top:40px;
}

h3{color:#00ff88;margin:0;}

p{color:#aaa;font-size:0.9rem;}

/* BUTTON */
.btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(90deg,#00ff88,#00aaff);
}

.btn:hover{
filter:brightness(1.2);
}

/* PAYPAL BOX */
.paypal{
text-align:center;
margin-top:10px;
color:#aaa;
font-size:0.9rem;
background:#111;
padding:10px;
border-radius:10px;
border:1px solid #222;
}
</style>
</head>

<body>

<header>
<div class="logo">PLAY MODS</div>
<div class="sub">Mods seguros • Actualización semanal</div>
</header>

<!-- ROBLOX -->
<section>
<h2>🎮 Mods Roblox</h2>

<div class="grid">

<div class="card">
<img src="rblx.png">

<div class="content">
<h3>Roblox Mod</h3>
<p>Mejoras y funciones extra.</p>

<button class="btn" onclick="startDownload(this)">
Ver anuncio y descargar
</button>

</div>
</div>

</div>
</section>

<!-- MINECRAFT -->
<section>
<h2>⛏ Mods para Minecraft</h2>

<div class="paypal">
💳 PayPal: <b>aidanrivasramos62@gmail.com</b>
</div>

<div class="grid">

<!-- ESSENTIAL -->
<div class="card">
<img src="https://i.imgur.com/5cX1b7Q.png">

<div class="content">
<h3>Essential Mod</h3>
<p>Mod básico para mejorar experiencia.</p>
<p><b>Precio:</b> 1$</p>

<button class="btn">
Comprar / Contactar
</button>
</div>
</div>

<!-- SIORES -->
<div class="card">
<img src="https://i.imgur.com/7yQZ1cA.png">

<div class="content">
<h3>Siores Mod</h3>
<p>Funciones avanzadas para Minecraft.</p>
<p><b>Precio:</b> 2$</p>

<button class="btn">
Comprar / Contactar
</button>
</div>
</div>

</div>
</section>

<script>

let locked = false;
let tabActive = true;
let interval = null;

/* anti cambio de pestaña */
document.addEventListener("visibilitychange", ()=>{
tabActive = !document.hidden;
});

/* descarga roblox */
function startDownload(btn){

if(locked) return;
locked = true;

clearInterval(interval);

window.open("https://omg10.com/4/11120812","_blank");

btn.disabled = true;

let time = 6;
let progress = 0;

let barContainer = document.createElement("div");
barContainer.style.height="6px";
barContainer.style.background="#222";
barContainer.style.borderRadius="10px";
barContainer.style.marginTop="10px";
barContainer.style.overflow="hidden";

let bar = document.createElement("div");
bar.style.height="100%";
bar.style.width="0%";
bar.style.background="#00ff88";

barContainer.appendChild(bar);
btn.parentElement.appendChild(barContainer);

interval = setInterval(()=>{

if(!tabActive){
clearInterval(interval);
locked = false;
btn.disabled = false;
btn.innerText = "Ver anuncio y descargar";
alert("❌ Descarga inválida");
return;
}

time--;
progress += 16.6;

btn.innerText = "Espera " + time + "s";
bar.style.width = progress + "%";

if(time <= 0){

clearInterval(interval);

btn.innerText = "Descargar APK";
btn.disabled = false;

btn.onclick = ()=>{
window.open("https://www.mediafire.com/file/od6nt3rf9tpzyyv/Delta-updated.apk/file","_blank");
};

locked = false;
}

},1000);

}

</script>

</body>
</html>
