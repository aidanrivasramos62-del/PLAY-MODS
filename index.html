<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Mods</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Orbitron',sans-serif;
background:#050505;
color:white;
}

header{
text-align:center;
padding:70px 20px;
}

.logo{
font-size:4rem;
color:#00ff88;
text-shadow:0 0 20px #00ff88;
}

.sub{
color:#bbb;
margin-top:10px;
}

.stats{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-top:25px;
}

.stat{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:10px;
}

.search{
max-width:600px;
margin:20px auto;
padding:0 20px;
}

.search input{
width:100%;
padding:15px;
border-radius:30px;
border:none;
outline:none;
background:#111;
color:white;
}

.grid{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:rgba(255,255,255,0.05);
border-radius:15px;
overflow:hidden;
border:1px solid rgba(255,255,255,0.1);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.content{
padding:15px;
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00ff88,#00aaff);
cursor:pointer;
font-weight:bold;
}

.progress{
height:6px;
background:#222;
border-radius:10px;
overflow:hidden;
display:none;
margin-top:10px;
}

.bar{
height:100%;
width:0%;
background:#00ff88;
}

.toast{
position:fixed;
bottom:20px;
right:20px;
background:#111;
padding:15px;
border-left:4px solid #00ff88;
display:none;
}

section{
max-width:1000px;
margin:60px auto;
padding:0 20px;
}

h2{
text-align:center;
color:#00ff88;
}
</style>
</head>

<body>

<header>
<div class="logo">PLAY MODS</div>
<div class="sub">Mods para Android • 1 Mod semanal</div>

<div class="stats">
<div class="stat">🎮 Mods</div>
<div class="stat">🆕 Semanal</div>
<div class="stat">🚀 Actualizado</div>
</div>
</header>

<div class="search">
<input type="text" id="search" placeholder="Buscar mods...">
</div>

<div class="grid" id="grid">

<div class="card">
<img src="rblx.png">

<div class="content">
<h3>Roblox Mod</h3>
<p>Mejoras y funciones extra.</p>

<button class="btn" onclick="descargarRoblox(this)">
Ver anuncio y descargar
</button>

<div class="progress">
<div class="bar"></div>
</div>
</div>
</div>

</div>

<section>
<h2>📰 Novedades</h2>
<p style="text-align:center;color:#bbb;">
Nuevo mod cada semana en Play Mods.
</p>
</section>

<section>
<h2>❓ FAQ</h2>
<p style="text-align:center;color:#bbb;">
¿Es gratis? Sí.<br>
¿Se actualiza? Semanalmente.<br>
</p>
</section>

<section>
<h2>📞 Contacto</h2>
<p style="text-align:center;color:#bbb;">
Correo: aidanrivasramos62@gmail.com<br>
Discord: maestro_gato122013
</p>
</section>

<div class="toast" id="toast"></div>

<script>

function toast(msg){
let t=document.getElementById("toast");
t.innerText=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",3000);
}

function descargarRoblox(btn){

window.open("https://omg10.com/4/11120812","_blank");

btn.disabled=true;

let time=6;

btn.innerText="Espera "+time+"s";

let interval=setInterval(()=>{

time--;
btn.innerText="Espera "+time+"s";

if(time<=0){

clearInterval(interval);

btn.disabled=false;

btn.innerText="Descargar APK";

btn.onclick=()=>{

window.open(
"https://www.mediafire.com/file/od6nt3rf9tpzyyv/Delta-updated.apk/file",
"_blank"
);

};

toast("Descarga desbloqueada ✔");

}

},1000);
}

</script>

</body>
</html>
